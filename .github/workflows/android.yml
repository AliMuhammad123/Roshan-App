name: Android build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ROSHAN_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Smoke test all twelve levels
        working-directory: tests
        run: npm ci && node smoke.js

      - name: Install Capacitor and sync web assets
        run: npm ci && npx cap sync android

      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ROSHAN_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/roshan.keystore"

      - name: Signed release AAB and APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ROSHAN_KEYSTORE_PATH: ${{ runner.temp }}/roshan.keystore
          ROSHAN_KEYSTORE_PASSWORD: ${{ secrets.ROSHAN_KEYSTORE_PASSWORD }}
          ROSHAN_KEY_ALIAS: ${{ secrets.ROSHAN_KEY_ALIAS }}
          ROSHAN_KEY_PASSWORD: ${{ secrets.ROSHAN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: roshan-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: roshan-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
